<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gift card</title>
<style>
html,body{margin:0;height:100%;background:#3b2433;color:#fff4ee;font-family:Tahoma,"Segoe UI",sans-serif;text-align:center}
body{background:radial-gradient(120% 80% at 50% 20%,#5a3048,#3b2433 70%) #3b2433}
form{margin:0}
input.t{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.stage{min-height:100vh;box-sizing:border-box;padding:24px 16px;display:grid;place-items:center}
.stage>.intro,.stage>.cards{grid-area:1/1}
.intro{position:relative;z-index:2}

/* ---------- envelope ---------- */
.intro{display:flex;flex-direction:column;align-items:center;gap:26px;max-height:600px;overflow:visible}
h1{font-size:24px;margin:0;color:#f7e6e4;font-weight:bold}
.env{position:relative;display:block;width:320px;max-width:86vw;aspect-ratio:3/2;height:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;perspective:1000px;-webkit-perspective:1000px;filter:drop-shadow(0 22px 28px rgba(0,0,0,.45))}
@supports not (aspect-ratio:1){.env{height:213px}}
.env span{position:absolute;display:block}
.env .inside{inset:0;background:linear-gradient(#b9727f,#cf929d);border-radius:8px;z-index:0}
.env .paper{left:6%;right:6%;top:7%;height:86%;z-index:1;border-radius:5px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.env .paper img{width:100%;height:100%;object-fit:cover;display:block}
.env .pocket{inset:0;z-index:2;border-radius:8px;background:linear-gradient(160deg,#fbe9ec,#f2cdd4);
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);-webkit-clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env .side{inset:0;z-index:2;border-radius:8px;background:linear-gradient(200deg,#f6dbe0,#edc3cb);
  clip-path:polygon(0 0,50% 56%,0 100%);-webkit-clip-path:polygon(0 0,50% 56%,0 100%)}
.env .side.r{background:linear-gradient(160deg,#f6dbe0,#e9bcc5);clip-path:polygon(100% 0,50% 56%,100% 100%);-webkit-clip-path:polygon(100% 0,50% 56%,100% 100%)}
.env .flap{left:0;right:0;top:0;height:60%;z-index:3;transform-origin:50% 0;-webkit-transform-origin:50% 0;
  background:linear-gradient(#f4d3d9,#e7b3bd);clip-path:polygon(0 0,100% 0,50% 100%);-webkit-clip-path:polygon(0 0,100% 0,50% 100%);border-radius:8px 8px 0 0}
.env .seal{left:50%;top:60%;width:54px;height:54px;margin:-27px 0 0 -27px;z-index:4;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#d24a5c,#8f1d2c 70%);box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.12);color:#ffdfe3;font-size:22px;line-height:54px}
.env .to{left:0;right:0;bottom:11%;z-index:4;color:#8a4555;font-weight:bold;font-size:14px}
.openbtn{margin:0}

/* ---------- cards ---------- */
.cards{display:none;width:100%;max-width:820px}
.card{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 26px 60px -22px rgba(0,0,0,.75)}
.cards .b,.cards .lab-back,.cards .hint-b{display:none}
.hint{color:#e6c9cf;font-size:14px;margin:16px 0 4px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;border:0;font:bold 15px Tahoma,sans-serif;background:#e8c27a;color:#3b2433;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none}
.btn.spa{background:#3f6c5a;color:#f3eccb}
.btn.loc{background:#f7e6e4;color:#5a3048}
.btn.ghost{background:transparent;color:#e6c9cf;box-shadow:inset 0 0 0 1.5px rgba(230,201,207,.5)}
.note{color:#d9b9c0;font-size:12px;margin:14px 0 0}
code{display:inline-block;margin-top:6px;padding:5px 10px;border-radius:8px;background:#4d3042;color:#f7e6e4;direction:ltr;word-break:break-all;-webkit-user-select:all;user-select:all;font-size:12px}

/* ---------- flower rain ---------- */
.rain{display:none}
.rain i{position:fixed;top:-40px;pointer-events:none;z-index:20;font-style:normal;line-height:1;opacity:0;animation-name:petal;animation-timing-function:linear;animation-iteration-count:2;animation-fill-mode:both}
.rain .pt{width:12px;height:16px;border-radius:12px 0 12px 0}
@keyframes petal{0%{opacity:0;transform:translate(0,0) rotate(0)}8%{opacity:.95}50%{transform:translate(var(--dx),55vh) rotate(calc(var(--r)/2))}92%{opacity:.9}100%{opacity:0;transform:translate(calc(var(--dx)*-1),110vh) rotate(var(--r))}}

/* ---------- states (no JavaScript) ---------- */
#open:checked ~ .stage .intro{pointer-events:none;animation:introOut .5s ease 2.1s forwards}
#open:checked ~ .stage .cards{position:relative;z-index:1}
#open:checked ~ .stage .intro h1,#open:checked ~ .stage .openbtn{animation:fade .4s ease forwards}
#open:checked ~ .stage .seal{animation:sealOff .35s ease forwards}
#open:checked ~ .stage .flap{animation:flapOpen .6s ease .2s forwards}
#open:checked ~ .stage .paper{animation:paperUp 1.1s cubic-bezier(.3,.7,.2,1) .8s forwards}
#open:checked ~ .stage .cards{display:block;opacity:0;animation:cardIn .8s cubic-bezier(.2,.7,.2,1) 2.5s forwards}
#open:checked ~ .rain{display:block}
#open:checked ~ .stage .lab-gift{animation:pop .6s ease 5s both}
#gift:checked ~ .stage .a,#gift:checked ~ .stage .lab-gift,#gift:checked ~ .stage .hint-a{display:none}
#gift:checked ~ .stage .b{display:block;animation:fadeIn .6s ease}
#gift:checked ~ .stage .lab-back{display:inline-block}
#gift:checked ~ .stage .hint-b{display:block}
@keyframes fade{to{opacity:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes sealOff{to{opacity:0;transform:scale(.3)}}
@keyframes flapOpen{0%{transform:rotateX(0);z-index:3}49%{z-index:3}50%{z-index:0}100%{transform:rotateX(180deg);z-index:0}}
@keyframes paperUp{0%{transform:none}100%{transform:translateY(-78%)}}
@keyframes introOut{0%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes cardIn{0%{opacity:0;transform:translateY(-40px) scale(.6)}100%{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
.music{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:30;width:44px;height:44px;border-radius:50%;border:0;background:rgba(247,230,228,.15);color:#f7e6e4;font-size:20px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.music.off{opacity:.55;text-decoration:line-through}
.player{margin:16px auto 0;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#e6c9cf;font-size:13px}
.player audio{width:100%;max-width:320px;height:40px}
@media (prefers-reduced-motion:reduce){.rain{display:none!important}}
h1 small{display:block;font-size:13px;letter-spacing:.5px;color:#e8c27a;font-weight:bold;margin-bottom:8px}
</style>
</head>
