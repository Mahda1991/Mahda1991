<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کارت تولد خواهر</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one centered stage — envelope opens, birthday card rises out, then the gift card flips in. Single deliberate dusky-rose look. */
:root{
  --ground:#3b2433; --ground-2:#5a3048; --paper:#f7e6e4; --flap:#e9c3c8; --seal:#8f1d2c;
  --ink:#fff4ee; --muted:#e6c9cf; --gold:#e8c27a; --spa:#3f6c5a;
  --f-display:"Lalezar","Vazirmatn",Tahoma,sans-serif; --f-body:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 10%,var(--ground-2),var(--ground) 70%);background-color:var(--ground);color:var(--ink);font-family:var(--f-body);direction:rtl;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;box-sizing:border-box}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,46px);margin:0;letter-spacing:0;color:var(--paper);text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:15px}

/* Envelope */
.env{position:relative;width:min(440px,88vw);aspect-ratio:1.55/1;cursor:pointer;border:0;padding:0;background:none;perspective:1200px;-webkit-tap-highlight-color:transparent}
.env:focus-visible{outline:3px solid var(--gold);outline-offset:8px;border-radius:8px}
.env .back{position:absolute;inset:0;background:var(--flap);border-radius:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.env .front{position:absolute;inset:0;border-radius:10px;z-index:3;
  background:linear-gradient(to top right,var(--paper) 50%,transparent 50.4%) left/50% 100% no-repeat,linear-gradient(to top left,var(--paper) 50%,transparent 50.4%) right/50% 100% no-repeat}
.env .front::after{content:"";position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(#f0d6d6,var(--paper));clip-path:polygon(0 100%,50% 0,100% 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:60%;z-index:4;transform-origin:top;transition:transform .7s cubic-bezier(.6,.05,.3,1),z-index 0s .35s;
  background:#e2b4bb;clip-path:polygon(0 0,100% 0,50% 100%);border-radius:10px 10px 0 0}
.env .seal{position:absolute;z-index:5;left:50%;top:60%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c23a4b,var(--seal));display:grid;place-items:center;color:#ffd9d9;font-size:24px;box-shadow:0 4px 10px rgba(0,0,0,.35);transition:opacity .3s,transform .3s}
.env .to{position:absolute;z-index:5;bottom:12%;left:0;right:0;color:#7a3b4a;font-weight:600;font-size:clamp(13px,3.4vw,16px)}
.env .peek{position:absolute;z-index:2;left:6%;right:6%;top:8%;bottom:8%;border-radius:6px;background:#fff center/cover;transition:transform .9s cubic-bezier(.3,.6,.2,1) .45s}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0;transform:scale(.4)}
.env.open .peek{transform:translateY(-70%)}
.env{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.env *{pointer-events:none}
.bobber{}
.env .peek{opacity:0}
.env.open .peek{opacity:1;transition:opacity .2s .3s,transform .9s cubic-bezier(.3,.6,.2,1) .45s}
.openbtn{margin-top:-4px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.loc{background:var(--paper);color:#5a3048}
.locbox{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--muted);max-width:100%}
.locbox code{user-select:all;-webkit-user-select:all;background:rgba(255,255,255,.08);padding:6px 10px;border-radius:8px;font-size:13px;color:var(--paper);word-break:break-all;max-width:100%}
@keyframes bob{50%{transform:translateY(-6px) rotate(-.6deg)}}

/* Cards */
.cards{display:none;flex-direction:column;align-items:center;gap:18px;width:100%}
.cards.show{display:flex}
.flip{width:min(860px,100%);aspect-ratio:5462/3875;max-width:100%}
.flip-inner{position:relative;width:100%;height:100%}
.face{position:absolute;inset:0;border-radius:12px;box-shadow:0 30px 70px -25px rgba(0,0,0,.7);transition:opacity .7s ease,transform .7s ease}
.face img{width:100%;height:100%;object-fit:cover;display:block;border-radius:12px}
.face.b{opacity:0;transform:scale(.94) translateX(-6%);pointer-events:none}
.flip.turned .face.a{opacity:0;transform:scale(.94) translateX(6%);pointer-events:none}
.flip.turned .face.b{opacity:1;transform:none;pointer-events:auto}

@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.9)}}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{font-family:var(--f-body);font-weight:600;font-size:15px;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;background:var(--gold);color:#3b2433;transition:transform .15s,filter .15s}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px rgba(230,201,207,.45)}
.btn.spa{background:var(--spa);color:#f3eccb}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.hint{font-size:13px;color:var(--muted);margin:0;min-height:1.4em}
#fx{position:fixed;left:0;top:0;width:0;height:0;overflow:visible;pointer-events:none;z-index:50}
.cf{position:fixed;top:-20px;width:9px;height:5px;border-radius:2px;pointer-events:none;animation:fall linear forwards}
.cf.h{width:auto;height:auto;background:none!important;font-size:14px;line-height:1}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>

</head>
<body>
<div id="fx" aria-hidden="true"></div>
<main class="stage">
  <div id="intro" style="display:flex;flex-direction:column;align-items:center;gap:22px">
    <h1>یه نامه برات رسیده 💌</h1>
    <div class="bobber"><button class="env" id="env" type="button" aria-label="باز کردن پاکت">
      <span class="back"></span>
      <span class="peek" style="background:#fffaf6"></span>
      <span class="front"></span>
      <span class="flap"></span>
      <span class="seal">♥</span>
      <span class="to">برای خواهر مهربون و عزیزم</span>
    </button></div>
    <button class="btn openbtn" id="openBtn" type="button">باز کردن نامه 💌</button>
  </div>

  <section class="cards" id="cards" aria-live="polite">
    <div class="flip" id="flip">

    </div>
    <p class="hint" id="hint">یه هدیه هم پشت این کارت منتظرته 🎁</p>
    <div class="controls">
      <button class="btn spa" id="turn">دیدن هدیه</button>
      <a class="btn loc" href="https://maps.app.goo.gl/LfWdMDashg6TxtG88?g_st=ic" target="_blank" rel="noopener">📍 لوکیشن سالن ونچی</a>
      <button class="btn ghost" id="again">دوباره از اول</button>
    </div>
    <div class="locbox">
      <span>اگه لوکیشن باز نشد، لینک رو کپی کن و توی مرورگر یا گوگل مپ بزن:</span>
      <code id="locText" dir="ltr">https://maps.app.goo.gl/LfWdMDashg6TxtG88</code>
      <button class="btn ghost" id="copyLoc" type="button">کپی لینک لوکیشن</button>
    </div>
  </section>
</main>

<script>
(function(){
  const env=document.getElementById('env'),intro=document.getElementById('intro'),cards=document.getElementById('cards'),
        flip=document.getElementById('flip'),turn=document.getElementById('turn'),hint=document.getElementById('hint'),again=document.getElementById('again');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fx=document.getElementById('fx');
  const cols=['#f4a6b7','#e8c27a','#b9a3d6','#7fc4b0','#f27a6b','#fff1e8'];
  function burst(n,palette){
    if(reduce)return;const pal=palette||cols;
    for(let i=0;i<n;i++){const s=document.createElement('span');const heart=Math.random()<.2;
      s.className='cf'+(heart?' h':'');if(heart){s.textContent='♥';s.style.color=pal[i%pal.length]}else s.style.background=pal[i%pal.length];
      s.style.left=(Math.random()*100)+'vw';s.style.setProperty('--dx',((Math.random()-.5)*120)+'px');s.style.setProperty('--r',(Math.random()*720-360)+'deg');
      s.style.animationDuration=(2.2+Math.random()*1.8)+'s';s.style.animationDelay=(Math.random()*.6)+'s';
      fx.appendChild(s);setTimeout(()=>s.remove(),4800);}
  }
  let opening=false;
  function open(e){
    if(e&&e.preventDefault)e.preventDefault();
    if(opening)return;opening=true;
    env.classList.add('open');
    try{burst(60)}catch(_){}
    setTimeout(()=>{intro.style.display='none';cards.classList.add('show');try{burst(50)}catch(_){}},reduce?50:1300);
  }
  env.addEventListener('click',open);
  document.getElementById('openBtn').addEventListener('click',open);
  intro.addEventListener('click',e=>{if(e.target.closest('.bobber'))open(e)});
  turn.addEventListener('click',()=>{
    const t=flip.classList.toggle('turned');
    turn.textContent=t?'برگشت به کارت تبریک':'دیدن هدیه';
    hint.textContent=t?'پکیج ماساژ تایلندی و فیشیال ریلکسی، هدیه‌ی تولدت 🌿':'یه هدیه هم پشت این کارت منتظرته 🎁';
    if(t)burst(40,['#3f6c5a','#e8c27a','#f3eccb','#a8c8b0']);
  });
  flip.addEventListener('click',()=>turn.click());
  const cb=document.getElementById('copyLoc'),lt=document.getElementById('locText');
  cb.addEventListener('click',()=>{const done=()=>{cb.textContent='کپی شد ✓';setTimeout(()=>cb.textContent='کپی لینک لوکیشن',2000)};
    const sel=()=>{const r=document.createRange();r.selectNodeContents(lt);const s=getSelection();s.removeAllRanges();s.addRange(r);try{if(document.execCommand('copy'))done();else cb.textContent='لینک انتخاب شد، کپی کن'}catch(_){cb.textContent='لینک انتخاب شد، کپی کن'}};
    try{navigator.clipboard.writeText(lt.textContent).then(done,sel)}catch(_){sel()}});flip.style.cursor='pointer';
  again.addEventListener('click',()=>{opening=false;flip.classList.remove('turned');turn.textContent='دیدن هدیه';cards.classList.remove('show');env.classList.remove('open');intro.style.display='flex';hint.textContent='یه هدیه هم پشت این کارت منتظرته 🎁'});
})();
</script>
